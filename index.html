<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grym</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .pulse-size {
            font-size: 1.5rem;
            font-family: monospace;
            color: orangered;
            display: inline-block; /* Required for transform scale to work properly */
            text-align: center;
            animation: pulseSize 1.6s ease-in-out infinite;
        }

        @keyframes pulseSize {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.0125); /* Grows by 10% */
            }
            100% {
                transform: scale(1);
            }
        }
    </style>
